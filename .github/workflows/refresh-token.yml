name: refresh-token
# Gia hạn token Threads dài hạn định kỳ để token không bao giờ chết.
# Chạy ~2 tuần/lần (an toàn trong 60 ngày) + chạy tay được. Ghi token mới vào Secret THREADS_ACCESS_TOKEN.
on:
  schedule:
    - cron: '0 3 1,15 * *'   # ngày 1 & 15 hằng tháng, 03:00 UTC
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Gia hạn token Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}   # PAT scope repo để ghi lại Secret
        run: node src/refresh-token.js
